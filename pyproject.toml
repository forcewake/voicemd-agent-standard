[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemd"
version = "0.1.0a1"
description = "Reference implementation of the VOICE.md Agent Communication Contract"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "VoiceMD contributors"}
]
keywords = ["agents", "voice", "prompt", "ai", "llm", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
mcp = ["mcp>=1.0"]
nemotron = ["websockets>=13"]

[project.scripts]
voicemd = "voicemd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicemd = ["resources/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
