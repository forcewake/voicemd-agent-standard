name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: python -m compileall -q src integrations/mcp scripts
      - run: coverage run -m pytest
      - run: coverage report
      - run: voicemd validate --path templates/full/VOICE.md --strict
      - run: voicemd validate --path templates/spoken/VOICE.md --strict
      - run: voicemd compile --path templates/full/VOICE.md --profile nemotron_voicechat --format nemotron-ascii --compact --max-chars 5000 --output /tmp/nemotron.txt
      - run: python -c "from pathlib import Path; prompt = Path('/tmp/nemotron.txt').read_text(); assert prompt.isascii() and len(prompt) <= 5000"

  cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.14"
            pytest-args: ""
          - os: windows-latest
            python-version: "3.14"
            pytest-args: "--ignore=tests/test_lite.py"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m compileall -q src integrations/mcp scripts
      - run: python -m pytest ${{ matrix.pytest-args }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement constraints/build.txt
      - run: python -m pip install --constraint constraints/build.txt --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest tests/test_release_scripts.py
      - run: python scripts/verify_pages.py site
      - run: python scripts/build_release.py --output /tmp/voicemd-a.zip --provenance-output /tmp/voicemd-a.intoto.jsonl
      - run: python scripts/build_release.py --output /tmp/voicemd-b.zip
      - run: cmp /tmp/voicemd-a.zip /tmp/voicemd-b.zip
      - run: python scripts/verify_release.py /tmp/voicemd-a.zip --provenance /tmp/voicemd-a.intoto.jsonl --expected-release-revision "$(git rev-parse HEAD)" --trusted-runtime-checks
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: python -m build --no-isolation --outdir /tmp/dist-a
      - run: python -m build --no-isolation --outdir /tmp/dist-b
      - run: python scripts/build_release.py --normalize-sdist /tmp/dist-a/*.tar.gz
      - run: python scripts/build_release.py --normalize-sdist /tmp/dist-b/*.tar.gz
      - run: for artifact in /tmp/dist-a/*; do cmp "$artifact" "/tmp/dist-b/$(basename "$artifact")"; done
      - run: python scripts/build_release.py --distributions /tmp/dist-a --metadata-output /tmp/release-metadata --source-revision "$(git rev-parse HEAD)" --release-revision "$(git rev-parse HEAD)"
      - run: python scripts/verify_release.py --distributions /tmp/dist-a --metadata /tmp/release-metadata --source-root . --source-revision "$(git rev-parse HEAD)" --release-revision "$(git rev-parse HEAD)"
      - run: python -m venv /tmp/voicemd-wheel
      - run: /tmp/voicemd-wheel/bin/python -m pip install /tmp/dist-a/*.whl
      - run: /tmp/voicemd-wheel/bin/python -m pip check
      - run: /tmp/voicemd-wheel/bin/python -m voicemd --version
      - run: python -m venv /tmp/voicemd-sdist
      - run: /tmp/voicemd-sdist/bin/python -m pip install /tmp/dist-a/*.tar.gz 'pytest>=8,<9'
      - run: /tmp/voicemd-sdist/bin/python -m pip check
      - run: /tmp/voicemd-sdist/bin/python -m pytest

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[mcp]'
      - run: python -m pip check
      - run: python -c "from mcp.server.fastmcp import FastMCP; import runpy; runpy.run_path('integrations/mcp/server.py')"

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/typescript/package-lock.json
      - run: npm --prefix integrations/typescript ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix integrations/typescript run check
      - run: npm --prefix integrations/typescript run build:conformance
      - run: git diff --exit-code -- integrations/typescript/generated
      - run: node integrations/typescript/generated/conformance-verifier.js conformance/vectors.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build integrations/dotnet/VoiceMd.Example.csproj --configuration Release --nologo

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file integrations/docker/Dockerfile --tag voicemd:test .
      - name: Run sidecar and smoke its HTTP API
        shell: bash
        run: |
          set -euo pipefail
          container="voicemd-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1::8765 \
            --volume "$PWD/VOICE.md:/contracts/VOICE.md:ro" \
            voicemd:test
          binding="$(docker port "$container" 8765/tcp)"
          port="${binding##*:}"
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${port}/health" \
              --output /tmp/voicemd-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/voicemd-health.json")); assert data == {"status":"ok","service":"voicemd","contract":"valid"}'
          curl --fail --silent --show-error \
            "http://127.0.0.1:${port}/v1/voice/prompt?profile=executive_brief" \
            --output /tmp/voicemd-prompt.json
          python -c 'import json; data=json.load(open("/tmp/voicemd-prompt.json")); assert isinstance(data.get("prompt"), str) and data["prompt"]'
          test "$(docker inspect --format '{{.State.Status}}' "$container")" = "running"
