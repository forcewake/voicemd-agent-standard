name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: voicemd validate --path templates/full/VOICE.md --strict
      - run: voicemd validate --path templates/spoken/VOICE.md --strict
      - run: voicemd compile --path templates/full/VOICE.md --profile nemotron_voicechat --format nemotron-ascii --compact --max-chars 5000 --output /tmp/nemotron.txt
      - run: python -c "from pathlib import Path; assert Path('/tmp/nemotron.txt').read_text().isascii()"
