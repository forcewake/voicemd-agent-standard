openapi: 3.1.0
info:
  title: VoiceMD Sidecar API
  version: 0.1.0
  description: Local/provider-neutral API for resolving, compiling, and linting VOICE.md contracts.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy and active contract is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  service: {type: string}
                  contract: {type: string, const: valid}
        "503":
          description: Active contract is missing or invalid
  /v1/voice/contract:
    get:
      operationId: getResolvedContract
      responses:
        "200":
          description: Resolved contract with path-safe provenance labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract: {type: object, additionalProperties: true}
                  body: {type: string}
                  sources:
                    type: array
                    items: {type: string}
                    description: Relative labels or external content-hash labels; never absolute paths
                required: [contract, body, sources]
                additionalProperties: false
  /v1/voice/prompt:
    get:
      operationId: compileVoicePrompt
      parameters:
        - {name: profile, in: query, schema: {$ref: "#/components/schemas/SelectorName"}}
        - {name: audience, in: query, schema: {$ref: "#/components/schemas/SelectorName"}}
        - {name: surface, in: query, schema: {$ref: "#/components/schemas/SelectorName"}}
        - {name: tone, in: query, schema: {$ref: "#/components/schemas/SelectorName"}}
        - name: format
          in: query
          schema:
            type: string
            enum: [prompt, json, canonical-json, sha256, ascii, nemotron, nemotron-ascii]
            default: prompt
        - name: compact
          in: query
          description: Must be serialized exactly as `true` or `false`.
          schema: {type: boolean, default: false}
        - {name: max_chars, in: query, schema: {type: integer, minimum: 256}}
      responses:
        "200":
          description: Compiled prompt
          content:
            application/json:
              schema:
                type: object
                required: [prompt]
                properties:
                  prompt: {type: string}
                additionalProperties: false
        "400":
          description: Invalid selector or contract
        "503":
          description: Active contract is missing or invalid
  /v1/voice/lint:
    post:
      operationId: lintVoiceText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
                profile: {$ref: "#/components/schemas/SelectorName"}
                audience: {$ref: "#/components/schemas/SelectorName"}
                surface: {$ref: "#/components/schemas/SelectorName"}
                tone: {$ref: "#/components/schemas/SelectorName"}
              additionalProperties: false
      responses:
        "200":
          description: Lint result
          content:
            application/json:
              schema:
                type: object
                required: [ok, issues]
                properties:
                  ok: {type: boolean}
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id: {type: string}
                        severity: {type: string}
                        message: {type: string}
                        evidence: {type: [string, "null"]}
                      required: [rule_id, severity, message, evidence]
                      additionalProperties: false
                additionalProperties: false
        "400":
          description: Invalid JSON request
        "411":
          description: Content-Length is required
        "413":
          description: Request body exceeds the configured limit
        "415":
          description: Content-Type must be application/json
        "503":
          description: Active contract is missing or invalid
components:
  schemas:
    SelectorName:
      type: string
      minLength: 1
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
